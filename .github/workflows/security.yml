name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          # go-version-input defaults to "stable" and always wins over
          # go-version-file in the underlying setup-go step unless cleared.
          go-version-input: ''
          go-version-file: go.mod
          go-package: ./...

  gosec:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The official Docker-based securego/gosec action bundles its own,
      # potentially older Go toolchain with GOTOOLCHAIN=local, which breaks
      # as soon as go.mod requires a newer patch version than that image
      # ships (as happened here). Installing gosec directly avoids that
      # coupling and uses the same toolchain as every other job.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...
